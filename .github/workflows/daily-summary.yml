name: daily-summary
on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append today's availability to LOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(date -u +%F)
          total=0; failed=0; page=1
          while :; do
            resp=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?created=${day}T00:00:00Z..${day}T23:59:59Z&per_page=100&page=$page")
            n=$(echo "$resp" | jq '.workflow_runs | length')
            [ "$n" = "0" ] && break
            total=$((total + n))
            failed=$((failed + $(echo "$resp" | jq '[.workflow_runs[] | select(.conclusion=="failure")] | length')))
            page=$((page + 1))
          done
          echo "| $day | $total | $failed |" >> LOG.md
          git config user.name uptime-bot
          git config user.email actions@users.noreply.github.com
          git add LOG.md && git commit -q -m "log $day: $total checks, $failed failed" && git push -q
