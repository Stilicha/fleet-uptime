name: uptime
on:
  schedule:
    - cron: '*/5 * * * *'   # best effort — GitHub може да ги разрежда при натоварване
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check fleetmngmnt.com
        run: |
          site=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://fleetmngmnt.com/ || echo ERR)
          api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://fleetmngmnt.com/api/health || echo ERR)
          echo "$(date -u +%FT%TZ) site=$site api=$api"
          test "$site" = "200" -a "$api" = "200"

      # графиците спират след 60 дни без комит в репото — веднъж месечно бутваме маркер
      - name: Monthly keepalive
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H%M)" \< "0015" ]; then
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ka
            cd ka
            date -u +%F > .keepalive
            git config user.name "uptime-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive && git commit -q -m "keepalive" && git push -q
          fi
